<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .todo {
            width: 720px;
            margin: 40px auto;
        }
        h1 {
            margin-bottom: 20px;
        }
        ul {
            list-style: none;
        }
        li {
            position: relative;
            padding: 15px 70px 15px 60px;
            font-size: 18px;
        }
        .color1 {
            background: #a7c9d6;
        }
        .color2 {
            background: #9fc3cf;
        }
        li::before {
            content: "";
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            background-image: url("checkbox.png");
            background-size: contain;
            background-repeat: no-repeat;
        }
        li::after {
            content: "";
            position: absolute;
            left: 240px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background-image: url("cross.png");
            background-size: contain;
            background-repeat: no-repeat;
        }
        .done {
            background: white;
            text-decoration: line-through;
        }
            .done::before {
                background-image: url("checked.png");
            }
    </style>
</head>
<body>
    <div class="todo">
        <h1>My To Do List</h1>
        <ul>
            <li class="color1">Hit the gym</li>
            <li class="color2 done">Pay bills</li>
            <li class="color1">Meet John</li>
            <li class="color2">Buy eggs</li>
            <li class="color1 done">Read a book</li>
            <li class="color2">Organize office</li>
            <li class="color1">Eat dinner</li>
            <li class="color2">Buy apples</li>
            <li class="color1">Meet George</li>
            <li class="color2">Feed the cat</li>
            <li class="color1 done">Write a letter</li>
            <li class="color2">Run 1 km</li>
        </ul>
    </div>
</body>
</html>
