<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Задание</title>
    <style>
    ol {
    background-color:#f2a3ad;
    list-style:none;
    counter-reset:item;
    width: 500px;
    padding: 20px;
}
    li {
    background-color:#d86a77;
    margin:10px;
    padding:10px;
    color:white;
    counter-increment:item;
}
    li::before {
    content: counter(item)  ".";
    color:white;
    margin-right:5px;
}
    span {
    background-color:#b8485a;
    padding:10px;
}
    </style>
</head>
<body>
    <ol>
        <li> <span>Apple</span></li>
        <li><span>Orange</span></li>
        <li><span>Pineapple</span></li>
        <li><span>Pear</span></li>
        <li><span>Cherry</span></li>
    </ol>
</body>
</html>
